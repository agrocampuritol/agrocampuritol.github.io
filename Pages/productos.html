<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producción y Mercado — Asociación Campesina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Assets/CSS/base.css">
<link rel="stylesheet" href="../Assets/CSS/page-hero.css">
<link rel="stylesheet" href="../Assets/CSS/seccion-contenido.css">
<link rel="stylesheet" href="../Assets/CSS/filtro.css">
<link rel="stylesheet" href="../Assets/CSS/tarjeta.css">
<link rel="stylesheet" href="../Assets/CSS/cargar-mas.css">
</head>
<body>

  <!-- NAVEGACIÓN (idéntica en todas las páginas) -->
  <div id="header-placeholder"></div>

  <!-- CABECERA DE PÁGINA -->
  <section class="page-hero">
    <div class="contenedor">
      <span class="eyebrow"></span>
      <h1>Mercado</h1>
    </div>
  </section>

  <!-- SUBSECCIÓN: PRODUCTOS -->
  <section class="seccion-contenido" id="productos">
    <div class="contenedor">
      <h2 class="titulo-bloque">Productos</h2>

      <div class="filtros">
        <button class="filtro activo">Todos</button>
        <button class="filtro">Alimento</button>
      </div>

      <div class="grid-tarjetas">

        <!-- PATRÓN DE TARJETA — copiar para añadir un nuevo producto -->
        <article class="tarjeta">
          <div class="tarjeta-imagen">
            <img src="../Assets/Images/IMG-20260827-WA0000.jpg" alt="Fotografía del producto">
          </div>
          <div class="tarjeta-cuerpo">
            <span class="tarjeta-etiqueta">Alimento</span>
            <h3>HENO</h3>
            <span style="color: green;">$14.000 und</span>
            <p class="descripcion-breve">Aporta fibra y mantiene la alimentación del ganado en épocas de escasez de pasto.</p>
            <a href="../Pages/Compra.html" class="tarjeta-enlace">Solicitar</a>
          </div>
        </article>
        <!-- FIN PATRÓN -->
                 <article class="tarjeta">
          <div class="tarjeta-imagen">
            <img src="../Assets/Images/IMG-20260827-WA0003.jpg" alt="Fotografía del producto">
          </div>
          <div class="tarjeta-cuerpo">
            <span class="tarjeta-etiqueta">Alimento</span>
            <h3>SILO</h3>
            <span style="color: green;">$26.250 und</span>
            <p class="descripcion-breve">Aporta energía y nutrientes, especialmente cuando disminuye la disponibilidad de forraje fresco.</p>
            <a href="/Pages/Compra.html" class="tarjeta-enlace">Solicitar</a>
          </div>
        </article>

      </div>

      <div class="cargar-mas">
        <button class="btn-secundario">Cargar más productos</button>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../Assets/JS/Unir.js"></script>

</body>
</html>
